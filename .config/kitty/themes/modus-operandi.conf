# Modus Operandi theme for Kitty terminal emulator
# Based on the modus-themes by Protesilaos Stavrou
# https://protesilaos.com/emacs/modus-themes-colors
# License: CC0 (public domain) — https://creativecommons.org/publicdomain/zero/1.0/

# ── Base ──────────────────────────────────────────────────────────────
foreground            #000000
background            #ffffff
cursor                #000000
cursor_text_color     #ffffff

# ── Selection ─────────────────────────────────────────────────────────
selection_foreground  #000000
selection_background  #bdbdbd

# ── Window borders ────────────────────────────────────────────────────
active_border_color   #5a5a5a
inactive_border_color #a3a3a3

# ── Bell ──────────────────────────────────────────────────────────────
bell_border_color     #f3d000

# ── URL ───────────────────────────────────────────────────────────────
url_color             #3548cf

# ── Tab bar ───────────────────────────────────────────────────────────
tab_bar_background    #dfdfdf
active_tab_foreground #000000
active_tab_background #ffffff
inactive_tab_foreground #585858
inactive_tab_background #c2c2c2

# ── Marks ─────────────────────────────────────────────────────────────
mark1_foreground      #000000
mark1_background      #ff8f88
mark2_foreground      #000000
mark2_background      #8adf80
mark3_foreground      #000000
mark3_background      #f3d000

# ── ANSI 16-colour palette ───────────────────────────────────────────
# Normal
color0  #000000  # black
color1  #a60000  # red
color2  #006800  # green
color3  #6f5500  # yellow
color4  #0031a9  # blue
color5  #721045  # magenta
color6  #005e8b  # cyan
color7  #a6a6a6  # white

# Bright
color8  #595959  # bright black
color9  #972500  # bright red
color10 #00663f  # bright green
color11 #884900  # bright yellow
color12 #3548cf  # bright blue
color13 #531ab6  # bright magenta
color14 #005f5f  # bright cyan
color15 #ffffff  # bright white
