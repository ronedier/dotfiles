# Modus Vivendi theme for Kitty terminal emulator
# Based on the modus-themes by Protesilaos Stavrou
# https://protesilaos.com/emacs/modus-themes-colors
# License: CC0 (public domain) — https://creativecommons.org/publicdomain/zero/1.0/

# ── Base ──────────────────────────────────────────────────────────────
foreground            #ffffff
background            #000000
cursor                #ffffff
cursor_text_color     #000000

# ── Selection ─────────────────────────────────────────────────────────
selection_foreground  #ffffff
selection_background  #5a5a5a

# ── Window borders ────────────────────────────────────────────────────
active_border_color   #959595
inactive_border_color #606060

# ── Bell ──────────────────────────────────────────────────────────────
bell_border_color     #7a6100

# ── URL ───────────────────────────────────────────────────────────────
url_color             #79a8ff

# ── Tab bar ───────────────────────────────────────────────────────────
tab_bar_background    #313131
active_tab_foreground #ffffff
active_tab_background #000000
inactive_tab_foreground #969696
inactive_tab_background #545454

# ── Marks ─────────────────────────────────────────────────────────────
mark1_foreground      #ffffff
mark1_background      #9d1f1f
mark2_foreground      #ffffff
mark2_background      #2f822f
mark3_foreground      #ffffff
mark3_background      #7a6100

# ── ANSI 16-colour palette ───────────────────────────────────────────
# Normal
color0  #000000  # black
color1  #ff5f59  # red
color2  #44bc44  # green
color3  #d0bc00  # yellow
color4  #2fafff  # blue
color5  #feacd0  # magenta
color6  #00d3d0  # cyan
color7  #a6a6a6  # white

# Bright
color8  #595959  # bright black
color9  #ff6b55  # bright red
color10 #00c06f  # bright green
color11 #fec43f  # bright yellow
color12 #79a8ff  # bright blue
color13 #b6a0ff  # bright magenta
color14 #6ae4b9  # bright cyan
color15 #ffffff  # bright white
